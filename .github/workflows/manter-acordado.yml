# Mantém o projeto Supabase da Farol acordado: o plano grátis pausa depois de 7 dias sem uso.
# A cada 3 dias chama a rota pública GET /config do jogo, que consulta o banco (conta como atividade).
# A chave usada é a publicável (pública por desenho, a mesma do frontend/js/config.js); nenhum segredo aqui.
name: Manter o Supabase acordado

on:
  schedule:
    - cron: "0 12 */3 * *"   # 12h UTC (9h de Brasília), a cada 3 dias
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta leve ao banco
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 --retry 2 \
            "https://sgvxbdnbihgadmtijryp.supabase.co/functions/v1/api/config" \
            -H "apikey: sb_publishable_dTf6RRb_SKNgs_kvotzxZw_GlaGdXVb")
          echo "HTTP $codigo"
          # 200 (cliente existe) ou 404 (nenhum cliente): os dois passaram pelo banco.
          if [ "$codigo" != "200" ] && [ "$codigo" != "404" ]; then exit 1; fi
